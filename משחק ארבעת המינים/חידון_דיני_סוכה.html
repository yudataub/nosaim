<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><!--LEADERBOARD:START--><script>
/*
 * leaderboard.js — מודול "רשימת האלופים" לכל משחק
 * =================================================
 * קובץ אחד, בלי תלויות. עובד גם בקובץ HTML שנפתח מהמחשב (file://).
 *
 * שימוש מינימלי (3 שורות):
 *   להוסיף את הקובץ לדף: <script src="leaderboard.js">  (או להטמיע: python leaderboard/embed.py game.html)
 *   Leaderboard.init({ game: 'חידון פרשת לך לך', url: 'https://script.google.com/macros/s/.../exec' });
 *   // בסוף המשחק:
 *   Leaderboard.finish(score);
 *
 * בלי url — הרשימה נשמרת במחשב/בטלפון הזה בלבד (מתאים לכיתה עם מחשב אחד).
 * עם url — רשימה משותפת לכל הילדים, דרך גיליון גוגל (ראו Code.gs + README.md).
 * אם אין אינטרנט — מוצגת הרשימה המקומית והתוצאה נשלחת בפעם הבאה שיש חיבור.
 */
(function (global) {
  'use strict';

  var DEFAULTS = {
    game: '',              // שם/מזהה המשחק — לכל משחק רשימה נפרדת
    url: 'https://script.google.com/macros/s/AKfycbwvFRKOEh2hU2sf1uO6gLx5J9s_7k6orN5OVHHyHcu2bT6lU9MVOvMTdFFwRyACUrDjqg/exec', // כתובת ה-Web App של Apps Script. ריק = רשימה מקומית בלבד.
                           // להדביק כאן פעם אחת → אחרי embed.py כל המשחקים משתמשים בה

    title: 'רשימת האלופים',
    limit: 10,             // כמה מקומות יש ברשימה
    order: 'desc',         // 'desc' = הניקוד הגבוה מנצח | 'asc' = הנמוך מנצח (זמן, מספר מהלכים)
    unit: 'נקודות',
    askClass: true,        // לבקש כיתה בטופס השם
    askSchool: false,      // לבקש בית ספר בטופס השם
    defaultPeriod: 'auto', // 'week' | 'all' | 'auto' (הלשונית שבה המקום של השחקן טוב יותר)
    maxScore: 1000000,
    confetti: true,
    texts: {}              // עקיפת טקסטים, למשל { enterList: 'נכנסת לרשימה!' }
  };

  var TEXTS = {
    week: 'השבוע',
    all: 'כל הזמנים',
    namePrompt: 'איך קוראים לכם?',
    nameHint: 'השם יופיע ברשימת האלופים',
    nameLabel: 'שם',
    classLabel: 'כיתה',
    schoolLabel: 'בית ספר',
    save: 'שמירה',
    close: 'סגירה',
    changeName: 'לא אתם? החליפו שם',
    you: 'אתם',
    loading: 'טוען את רשימת האלופים...',
    empty: 'עוד אין אף אחד ברשימה — היו הראשונים!',
    localNote: '📱 הרשימה של המכשיר הזה',
    offlineNote: '📡 אין חיבור — מוצגת הרשימה של המכשיר הזה. התוצאה תישלח כשיחזור החיבור',
    firstPlace: '👑 מקום ראשון! אתם האלופים של {period}!',
    firstEver: '👑 פתחתם את הרשימה — אתם במקום הראשון!',
    enterList: '🎉 נכנסתם לרשימת האלופים — מקום {rank}!',
    almost: 'המקום שלכם: {rank} מתוך {total}. עוד {gap} {unit} ואתם ברשימה! 💪',
    newBest: '⭐ שיא אישי חדש: {score}!',
    beatBest: 'השיא שלכם: {best}. נסו לשבור אותו!',
    viewRank: 'אתם במקום {rank} מתוך {total}',
    viewNone: 'שחקו ונסו להיכנס לרשימה!'
  };

  var KEY_PLAYER = 'lb-player-v1';
  var KEY_LOCAL = 'lb-local-v1:';
  var KEY_PENDING = 'lb-pending-v1';
  var MAX_LOCAL_ROWS = 500;

  var cfg = null;

  /* ---------- כלים ---------- */
  function extend(a, b) { for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function t(key, vars) {
    var s = (cfg && cfg.texts[key]) || TEXTS[key] || '';
    return s.replace(/\{(\w+)\}/g, function (_, k) { return vars && vars[k] != null ? vars[k] : ''; });
  }
  function fmt(n) { return Number(n).toLocaleString('he-IL'); }
  function store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function cleanText(v, max) {
    return String(v == null ? '' : v).replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
  }
  function newId() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function better(a, b, order) { return order === 'asc' ? a < b : a > b; }
  function startOfWeek() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay()); // יום ראשון
    return d.getTime();
  }
  function requireInit() { if (!cfg) init({}); }

  /* ---------- חישוב רשימה (אותה לוגיקה כמו ב-Code.gs) ---------- */
  function board(rows, meId, limit, order, since) {
    var best = {};
    rows.forEach(function (r) {
      var ts = Number(r.t) || 0;
      if (ts < since || r.hidden) return;
      var key = r.id || [r.name, r.cls, r.school].join('|');
      var s = Number(r.score) || 0;
      var b = best[key];
      if (!b) b = best[key] = { key: key, score: s, t: ts, seen: -1 };
      else if (better(s, b.score, order)) { b.score = s; b.t = ts; }
      if (ts >= b.seen) { b.seen = ts; b.name = r.name; b.cls = r.cls; b.school = r.school; } // השם העדכני ביותר
    });
    var list = Object.keys(best).map(function (k) { return best[k]; });
    list.sort(function (a, b) { return (order === 'asc' ? a.score - b.score : b.score - a.score) || a.t - b.t; });
    var rank = 0;
    for (var i = 0; i < list.length; i++) if (list[i].key === meId) { rank = i + 1; break; }
    return {
      leaders: list.slice(0, limit).map(function (e) {
        return { name: e.name, cls: e.cls, school: e.school, score: e.score, me: e.key === meId };
      }),
      rank: rank,
      total: list.length,
      best: rank ? list[rank - 1].score : null,
      cutoff: list.length >= limit ? list[limit - 1].score : null
    };
  }
  function localBoards(meId) {
    var rows = store(KEY_LOCAL + cfg.game) || [];
    return { week: board(rows, meId, cfg.limit, cfg.order, startOfWeek()), all: board(rows, meId, cfg.limit, cfg.order, 0) };
  }

  /* ---------- שחקן ---------- */
  function getPlayer() { return store(KEY_PLAYER); }
  function setPlayer(p) {
    var cur = getPlayer() || {};
    var next = {
      id: cur.id || newId(),
      name: cleanText(p.name, 20),
      cls: cleanText(p.cls, 10),
      school: cleanText(p.school, 40)
    };
    store(KEY_PLAYER, next);
    return next;
  }
  function ensurePlayer(force) {
    requireInit();
    var p = getPlayer();
    if (p && p.name && !force) return Promise.resolve(p);
    return new Promise(function (resolve) {
      var ov = overlay();
      var box = ov.firstChild;
      box.innerHTML =
        '<div class="lb-crown">✍️</div>' +
        '<h2 class="lb-h">' + esc(t('namePrompt')) + '</h2>' +
        '<p class="lb-sub">' + esc(t('nameHint')) + '</p>' +
        '<form class="lb-form" autocomplete="off">' +
          field('name', t('nameLabel'), p && p.name, 20, true) +
          (cfg.askClass ? field('cls', t('classLabel'), p && p.cls, 10, false) : '') +
          (cfg.askSchool ? field('school', t('schoolLabel'), p && p.school, 40, false) : '') +
          '<button class="lb-btn" type="submit">' + esc(t('save')) + '</button>' +
        '</form>';
      var form = box.querySelector('form');
      var nameIn = form.elements.name;
      setTimeout(function () { nameIn.focus(); }, 50);
      form.onsubmit = function (e) {
        e.preventDefault();
        var name = cleanText(nameIn.value, 20);
        if (name.length < 2) { nameIn.classList.add('lb-bad'); nameIn.focus(); return; }
        var saved = setPlayer({
          name: name,
          cls: form.elements.cls ? form.elements.cls.value : '',
          school: form.elements.school ? form.elements.school.value : ''
        });
        closeOverlay(ov);
        resolve(saved);
      };
    });
  }
  function field(name, label, val, max, req) {
    return '<label class="lb-field"><span>' + esc(label) + '</span>' +
      '<input name="' + name + '" maxlength="' + max + '" value="' + esc(val || '') + '"' + (req ? ' required' : '') + '></label>';
  }

  /* ---------- רשת ---------- */
  function timeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]);
  }
  function parse(r) {
    return r.json().then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || 'bad response'); return d; });
  }
  function post(body) {
    // text/plain = "בקשה פשוטה" — אין preflight, ולכן עובד מול Apps Script גם מ-file://
    return timeout(fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(parse), 15000);
  }
  function get(meId) {
    var q = ['game=' + encodeURIComponent(cfg.game), 'limit=' + cfg.limit, 'order=' + cfg.order, 'id=' + encodeURIComponent(meId || '')].join('&');
    return timeout(fetch(cfg.url + (cfg.url.indexOf('?') < 0 ? '?' : '&') + q).then(parse), 15000);
  }
  function flushPending() {
    var pend = store(KEY_PENDING) || [];
    if (!pend.length || !cfg.url) return Promise.resolve();
    var left = [];
    return pend.reduce(function (chain, item) {
      return chain.then(function () {
        if (item.url !== cfg.url) { left.push(item); return; }
        return post(item.body)['catch'](function () { left.push(item); });
      });
    }, Promise.resolve()).then(function () { store(KEY_PENDING, left); });
  }

  /* ---------- API ---------- */
  function init(opts) {
    cfg = extend(extend({}, DEFAULTS), opts || {});
    cfg.texts = extend({}, (opts && opts.texts) || {});
    cfg.game = cleanText(cfg.game || document.title || 'משחק', 60);
    cfg.limit = Math.max(3, Math.min(50, Number(cfg.limit) || 10));
    cfg.order = cfg.order === 'asc' ? 'asc' : 'desc';
    injectCss();
    if (cfg.url) setTimeout(function () { flushPending(); }, 1500);
    return api;
  }

  // שולח ניקוד ומחזיר Promise עם תוצאות (בלי להציג כלום)
  function submit(score) {
    requireInit();
    var p = getPlayer();
    if (!p || !p.name) return ensurePlayer().then(function () { return submit(score); });
    score = Math.max(0, Math.min(cfg.maxScore, Math.round(Number(score) || 0)));

    var rows = store(KEY_LOCAL + cfg.game) || [];
    var prevBest = null;
    rows.forEach(function (r) { if (r.id === p.id && (prevBest === null || better(r.score, prevBest, cfg.order))) prevBest = r.score; });
    var row = { id: p.id, name: p.name, cls: p.cls, school: p.school, score: score, t: Date.now() };
    rows.push(row);
    if (rows.length > MAX_LOCAL_ROWS) rows = rows.slice(-MAX_LOCAL_ROWS);
    store(KEY_LOCAL + cfg.game, rows);

    var base = { score: score, prevBest: prevBest, isBest: prevBest === null || better(score, prevBest, cfg.order), player: p };
    if (!cfg.url) return Promise.resolve(extend(base, { mode: 'local', boards: localBoards(p.id) }));

    var body = extend({ type: 'score', game: cfg.game, order: cfg.order, limit: cfg.limit }, row);
    return flushPending()
      .then(function () { return post(body); })
      .then(function (d) { return extend(base, { mode: 'online', boards: { week: d.week, all: d.all } }); })
      ['catch'](function () {
        var pend = store(KEY_PENDING) || [];
        pend.push({ url: cfg.url, body: body });
        store(KEY_PENDING, pend.slice(-50));
        return extend(base, { mode: 'offline', boards: localBoards(p.id) });
      });
  }

  // הדרך הרגילה: בסוף משחק — שולח ומציג את רשימת האלופים
  // options: { againText, onAgain, onClose }
  function finish(score, options) {
    requireInit();
    return ensurePlayer().then(function () {
      var ov = overlay();
      ov.firstChild.innerHTML = '<div class="lb-loading">' + esc(t('loading')) + '</div>';
      return submit(score).then(function (res) {
        renderBoard(ov, res, options || {});
        return res;
      });
    });
  }

  // פתיחת הרשימה בלי לשלוח ניקוד (למשל מכפתור 🏆 בתפריט)
  function open(options) {
    requireInit();
    var p = getPlayer();
    var meId = p && p.id;
    var ov = overlay();
    ov.firstChild.innerHTML = '<div class="lb-loading">' + esc(t('loading')) + '</div>';
    var done = function (mode, boards) { renderBoard(ov, { mode: mode, boards: boards, player: p }, options || {}); };
    if (!cfg.url) { done('local', localBoards(meId)); return Promise.resolve(); }
    return flushPending()
      .then(function () { return get(meId); })
      .then(function (d) { done('online', { week: d.week, all: d.all }); })
      ['catch'](function () { done('offline', localBoards(meId)); });
  }

  // רישום "כניסה למשחק" (לא חובה) — מופיע בלשונית "כניסות" בגיליון
  function enter() {
    requireInit();
    var p = getPlayer();
    if (!cfg.url || !p || !p.name) return Promise.resolve();
    return post({ type: 'entry', game: cfg.game, id: p.id, name: p.name, cls: p.cls, school: p.school })['catch'](function () {});
  }

  /* ---------- תצוגה ---------- */
  function overlay() {
    var old = document.querySelector('.lb-overlay');
    if (old) old.parentNode.removeChild(old);
    var ov = document.createElement('div');
    ov.className = 'lb-overlay';
    ov.innerHTML = '<div class="lb-modal" role="dialog" aria-modal="true" dir="rtl"></div>';
    document.body.appendChild(ov);
    return ov;
  }
  function closeOverlay(ov) { if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }

  function message(b, res, period) {
    var lines = [];
    var periodName = period === 'week' ? 'השבוע' : 'כל הזמנים';
    var hasScore = res.score != null;
    if (!b.rank) lines.push(t('viewNone'));
    else if (!hasScore) lines.push(t('viewRank', { rank: b.rank, total: b.total }));
    else if (b.rank === 1) lines.push(b.total > 1 ? t('firstPlace', { period: periodName }) : t('firstEver'));
    else if (b.rank <= cfg.limit) lines.push(t('enterList', { rank: b.rank }));
    else {
      var gap = cfg.order === 'asc' ? b.best - b.cutoff + 1 : b.cutoff - b.best + 1;
      lines.push(t('almost', { rank: b.rank, total: b.total, gap: fmt(Math.max(1, gap)), unit: cfg.unit }));
    }
    if (hasScore && res.prevBest !== null && res.prevBest !== undefined) {
      lines.push(res.isBest ? t('newBest', { score: fmt(res.score) }) : t('beatBest', { best: fmt(res.prevBest) }));
    }
    return lines;
  }

  function renderBoard(ov, res, options) {
    var boards = res.boards;
    var period = cfg.defaultPeriod;
    if (period !== 'week' && period !== 'all') {
      var w = boards.week.rank, a = boards.all.rank;
      period = a && a <= cfg.limit ? 'all' : (w ? 'week' : 'all');
    }
    var celebrated = false;

    function draw() {
      var b = boards[period];
      var me = res.player;
      var rows = b.leaders.map(function (e, i) {
        var pos = i + 1;
        var medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : pos;
        return '<li class="lb-row' + (e.me ? ' lb-me' : '') + (pos <= 3 ? ' lb-top' + pos : '') + '">' +
          '<span class="lb-pos">' + medal + '</span>' +
          '<span class="lb-name">' + esc(e.name) + (e.me ? ' <em>← ' + esc(t('you')) + '</em>' : '') +
            (e.cls || e.school ? '<small>' + esc([e.cls, e.school].filter(Boolean).join(' · ')) + '</small>' : '') + '</span>' +
          '<span class="lb-score">' + fmt(e.score) + '</span></li>';
      }).join('');
      var mine = '';
      if (b.rank > cfg.limit && me) {
        mine = '<ol class="lb-list lb-mine"><li class="lb-row lb-me"><span class="lb-pos">' + b.rank + '</span>' +
          '<span class="lb-name">' + esc(me.name) + ' <em>← ' + esc(t('you')) + '</em></span>' +
          '<span class="lb-score">' + fmt(b.best) + '</span></li></ol>';
      }
      var note = res.mode === 'local' ? t('localNote') : res.mode === 'offline' ? t('offlineNote') : '';
      var again = options.againText ? '<button class="lb-btn" data-act="again">' + esc(options.againText) + '</button>' : '';

      ov.firstChild.innerHTML =
        '<button class="lb-x" data-act="close" aria-label="' + esc(t('close')) + '">✕</button>' +
        '<div class="lb-crown">🏆</div>' +
        '<h2 class="lb-h">' + esc(cfg.title) + '</h2>' +
        '<p class="lb-sub">' + esc(cfg.game) + (res.score != null ? ' · ' + esc(fmt(res.score)) + ' ' + esc(cfg.unit) : '') + '</p>' +
        '<div class="lb-msg">' + message(b, res, period).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>' +
        '<div class="lb-tabs" role="tablist">' +
          '<button role="tab" data-p="week" class="' + (period === 'week' ? 'lb-on' : '') + '">' + esc(t('week')) + '</button>' +
          '<button role="tab" data-p="all" class="' + (period === 'all' ? 'lb-on' : '') + '">' + esc(t('all')) + '</button>' +
        '</div>' +
        (rows ? '<ol class="lb-list">' + rows + '</ol>' : '<div class="lb-empty">' + esc(t('empty')) + '</div>') +
        mine +
        '<div class="lb-actions">' + again + '<button class="lb-btn lb-soft" data-act="close">' + esc(t('close')) + '</button></div>' +
        '<div class="lb-foot">' + (note ? '<div>' + esc(note) + '</div>' : '') +
          (me ? '<div>' + esc(me.name) + ' · <a href="#" data-act="rename">' + esc(t('changeName')) + '</a></div>' : '') + '</div>';

      // קונפטי רק כשהתוצאה הזאת היא השיא של הילד והיא ברשימה — לא על תוצאה חלשה שמציגה שיא ישן
      if (!celebrated && res.score != null && res.isBest && b.rank && b.rank <= cfg.limit) { celebrated = true; confetti(); }
    }

    ov.onclick = function (e) {
      var el = e.target.closest ? e.target.closest('[data-act],[data-p]') : null;
      if (e.target === ov) el = { getAttribute: function (n) { return n === 'data-act' ? 'close' : null; } };
      if (!el) return;
      var p = el.getAttribute('data-p');
      if (p) { period = p; draw(); return; }
      var act = el.getAttribute('data-act');
      if (act === 'close') { closeOverlay(ov); if (options.onClose) options.onClose(); }
      else if (act === 'again') { closeOverlay(ov); if (options.onAgain) options.onAgain(); }
      else if (act === 'rename') {
        e.preventDefault();
        closeOverlay(ov);
        ensurePlayer(true).then(function () { open(options); });
      }
    };
    document.addEventListener('keydown', function onKey(e) {
      if (!ov.parentNode) { document.removeEventListener('keydown', onKey); return; }
      if (e.key === 'Escape') { closeOverlay(ov); document.removeEventListener('keydown', onKey); if (options.onClose) options.onClose(); }
    });
    draw();
  }

  function confetti() {
    if (!cfg.confetti) return;
    try { if (global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
    var colors = ['#f5b301', '#e8425a', '#2f9e6b', '#3b7dd8', '#9b59b6', '#ff8c1a'];
    var wrap = document.createElement('div');
    wrap.className = 'lb-confetti';
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = Math.random() * 0.6 + 's';
      s.style.animationDuration = 1.8 + Math.random() * 1.4 + 's';
      s.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 3800);
  }

  function injectCss() {
    if (document.getElementById('lb-css')) return;
    var css =
      '.lb-overlay{position:fixed;inset:0;z-index:2147483000;background:rgba(10,14,30,.72);display:flex;align-items:center;justify-content:center;padding:16px;animation:lbFade .2s ease-out}' +
      '.lb-modal{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#fffdf5,#fff4d6);color:#1e2440;border-radius:22px;padding:22px 20px 16px;box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 0 0 3px #f2c14e;text-align:center;font-family:inherit;direction:rtl;animation:lbPop .28s cubic-bezier(.2,1.4,.4,1)}' +
      '.lb-modal *{box-sizing:border-box}' +

    [0, 7, 12, 16],       // קפיצה חגיגית
    [4, 7, 12, 11, 12],   // "טה-דה" קטן
    [0, 2, 4, 7, 12],     // סולם פנטטוני
    [7, 12, 16, 19]       // נצנוץ גבוה
  ];
  var lastTune = -1;

  function soundCorrect(streak) {
    var i;
    do { i = Math.floor(Math.random() * WIN_TUNES.length); } while (i === lastTune && WIN_TUNES.length > 1);
    lastTune = i;
    // ככל שהרצף ארוך יותר — המנגינה עולה בגובה (עד אוקטבה)
    var base = 72 + Math.min(streak - 1, 6) * 2;
    WIN_TUNES[i].forEach(function (s, k) { bell(note(base + s), k * 0.085, 0.9, 0.28); });
    var end = WIN_TUNES[i].length * 0.085;
    // נצנוצים בסוף
    for (var k = 0; k < 4; k++) bell(note(base + 24 + [0, 4, 7, 12][k]), end + 0.05 + k * 0.045, 0.35, 0.07);
    // רצף של 3, 5, 10... — תרועה קטנה נוספת
    if (streak >= 3 && (streak === 3 || streak % 5 === 0)) {
      [0, 4, 7, 12, 16].forEach(function (s, k) { bell(note(base + 12 + s), end + 0.35 + k * 0.06, 0.6, 0.18); });
    }
  }

  function soundWrong() {
    // שני צלילים רכים יורדים — "אופס" עדין, לא זמזום מפחיד
    pad(note(64), 0, 0.35, 0.14);
    pad(note(60), 0.16, 0.5, 0.12);
  }

  function soundComplete(ratio) {
    var mel = [60, 64, 67, 72, 67, 72, 76, 79];
    mel.forEach(function (n, k) { bell(note(n + 12), k * 0.13, 0.8, 0.25); });
    var t = mel.length * 0.13;
    [60, 64, 67, 72].forEach(function (n) { pad(note(n), t, 1.8, 0.08); }); // אקורד סיום
    bell(note(84), t, 1.6, 0.3);
    if (ratio >= 0.9) for (var k = 0; k < 8; k++) bell(note(84 + [0, 4, 7, 12, 16, 19, 24, 28][k]), t + 0.3 + k * 0.05, 0.4, 0.08);
  }

  function soundClick() { bell(note(84), 0, 0.12, 0.05); }

  /* ---------------- ניקוד ---------------- */
  // 10 לתשובה נכונה + בונוס רצף (עד 10) + בונוס מהירות (עד 5).
  // כך גם כמה ילדים עם 20/20 לא יהיו בתיקו, ורצף מתגמל ריכוז.
  function pointsFor(streak, secs) {
    var streakBonus = Math.min((streak - 1) * 2, 10);
    var speedBonus = secs <= 8 ? 5 : secs <= 15 ? 3 : secs <= 25 ? 1 : 0;
    return { total: 10 + streakBonus + speedBonus, streakBonus: streakBonus, speedBonus: speedBonus };
  }

  function floatText(txt, el) {
    var r = el.getBoundingClientRect();
    for (var i = 0; i < 6; i++) {
      var s = document.createElement('div');
      s.className = 'float';
      s.textContent = i === 0 ? txt : ['⭐', '✨', '🌟', '💫', '🎉'][i - 1];
      s.style.left = (r.left + r.width / 2 - 14) + 'px';
      s.style.top = (r.top) + 'px';
      s.style.setProperty('--dx', (i === 0 ? 0 : (Math.random() * 160 - 80)) + 'px');
      s.style.animationDelay = (i * 0.05) + 's';
      if (i === 0) { s.style.fontWeight = '800'; s.style.color = '#16a34a'; }
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 1400);
    }
  }

  /* ---------------- משחק ---------------- */
  function stars(ch) {
    var sky = document.getElementById('sky'), h = '';
    for (var i = 0; i < 20; i++) {
      h += '<span style="left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;animation-delay:' +
        (Math.random() * 3) + 's;font-size:' + (Math.random() * 20 + 10) + 'px">' + ch + '</span>';
    }
    sky.innerHTML = h;
  }

  function restartGame() {
    state = { i: 0, correct: 0, points: 0, streak: 0, best: 0, selected: null, shown: false, last: null, t0: Date.now() };
    document.body.classList.remove('done');
    stars('✨');
    render();
  }

  function answer(idx, btn) {
    if (state.shown) return;
    var q = questions[state.i];
    state.selected = idx; state.shown = true;
    if (idx === q.correct) {
      state.correct++; state.streak++;
      state.best = Math.max(state.best, state.streak);
      var p = pointsFor(state.streak, (Date.now() - state.t0) / 1000);
      state.points += p.total; state.last = p;
      soundCorrect(state.streak);
      render();
      floatText('+' + p.total, document.querySelector('.opt.right') || btn);
    } else {
      state.streak = 0; state.last = null;
      soundWrong();
      render();
    }
  }

  function next() {
    soundClick();
    if (state.i < questions.length - 1) {
      state.i++; state.selected = null; state.shown = false; state.t0 = Date.now();
      render();
    } else {
      finishGame();
    }
  }

  function scoreMessage() {
    var pc = state.correct / questions.length * 100;
    if (pc >= 90) return ['מצוין! אתה מומחה דיני סוכה! 🌟', '#ca8a04'];
    if (pc >= 75) return ['טוב מאוד! אתה יודע המון! ⭐', '#2563eb'];
    if (pc >= 60) return ['יפה! כל הכבוד! 👍', '#16a34a'];
    return ['יש לך מה ללמוד... נסה שוב! 💪', '#ea580c'];
  }

  function finishGame() {
    document.body.classList.add('done');
    stars('⭐');
    var m = scoreMessage(), n = questions.length;
    document.getElementById('app').innerHTML =
      '<div class="trophy-big">🏆</div>' +
      '<h1>🎉 סיימת את המשחק! 🎉</h1>' +
      '<div class="result"><div class="n">' + state.correct + '/' + n + '</div>' +
      '<div class="pts">⭐ ' + state.points + ' נקודות</div>' +
      '<div class="msg" style="color:' + m[1] + '">' + m[0] + '</div></div>' +
      '<div class="stats">' +
      '<div style="background:#dcfce7;color:#166534">✅ תשובות נכונות<b style="color:#16a34a">' + state.correct + '</b></div>' +
      '<div style="background:#fee2e2;color:#991b1b">❌ טעויות<b style="color:#dc2626">' + (n - state.correct) + '</b></div>' +
      '</div>' +
      '<p class="how">🔥 הרצף הכי ארוך שלך: ' + state.best + ' תשובות<br>' +
      'כל תשובה נכונה = 10 נקודות, ועוד בונוס על רצף ועל תשובה מהירה</p>' +
      '<div class="row"><button class="big green" id="again">🔄 שחק שוב!</button>' +
      '<button class="big gold" id="lbopen">🏆 רשימת האלופים</button></div>';
    document.getElementById('again').onclick = restartGame;
    document.getElementById('lbopen').onclick = function () { if (window.Leaderboard) Leaderboard.open({ againText: '🔄 שחק שוב', onAgain: restartGame }); };
    soundComplete(state.correct / n);
    if (window.Leaderboard) {
      var pts = state.points;
      setTimeout(function () { Leaderboard.finish(pts, { againText: '🔄 שחק שוב', onAgain: restartGame }); }, 1800);
    }
  }

  function render() {
    var q = questions[state.i], n = questions.length, h = '';
    h += '<button class="iconbtn" id="snd" title="צליל">' + (soundOn ? '🔊' : '🔇') + '</button>';
    h += '<button class="iconbtn trophy" id="lb" title="רשימת האלופים">🏆</button>';
    h += '<h1>🏡 חידון דיני סוכה</h1><div class="pills">' +
      '<span class="pill">שאלה ' + (state.i + 1) + '/' + n + '</span>' +
      '<span class="pill score">⭐ ניקוד: ' + state.points + '</span>' +
      (state.streak >= 2 ? '<span class="pill streak">🔥 רצף ' + state.streak + '</span>' : '') + '</div>';
    h += '<div class="bar"><div style="width:' + ((state.i + 1) / n * 100) + '%"></div></div>';
    h += '<div class="qbox"><span class="emoji">' + q.emoji + '</span><h2>' + esc(q.question) + '</h2></div>';
    h += '<div class="opts">';
    q.options.forEach(function (o, k) {
      var cls = '';
      if (state.shown) cls = k === q.correct ? 'right' : (k === state.selected ? 'wrong' : 'dim');
      h += '<button class="opt ' + cls + '" data-k="' + k + '"' + (state.shown ? ' disabled' : '') + '>' + esc(o) + '</button>';
    });
    h += '</div>';
    if (state.shown) {
      var ok = state.selected === q.correct, p = state.last;
      h += '<div class="expl ' + (ok ? 'ok' : 'no') + '"><p class="t">' + (ok ? '✅ נכון! כל הכבוד!' : '❌ לא נכון, אבל בסדר!') + '</p>';
      if (ok) {
        h += '<span class="gain">+' + p.total + ' נקודות' +
          (p.streakBonus ? ' · 🔥 בונוס רצף +' + p.streakBonus : '') +
          (p.speedBonus ? ' · ⚡ בונוס מהירות +' + p.speedBonus : '') + '</span>';
      }
      h += '<p class="e">💡 ' + esc(q.explanation) + '</p></div>';
      h += '<button class="big" id="next">' + (state.i < n - 1 ? 'שאלה הבאה ◀' : 'סיום המשחק 🏅') + '</button>';
    }
    var app = document.getElementById('app');
    app.innerHTML = h;
    app.querySelectorAll('.opt').forEach(function (b) { b.onclick = function () { answer(+b.dataset.k, b); }; });
    document.getElementById('snd').onclick = function () { soundOn = !soundOn; if (soundOn) soundClick(); render(); };
    document.getElementById('lb').onclick = function () { if (window.Leaderboard) Leaderboard.open(); };
    var nx = document.getElementById('next'); if (nx) nx.onclick = next;
  }

  if (window.Leaderboard) Leaderboard.init({ game: GAME_ID, title: 'אלופי דיני סוכה', unit: 'נקודות' });
  window.__sukkah = { restartGame: restartGame, finishGame: finishGame };
  restartGame();
})();
</script>
