        keywords: ["חג האסיף", "האסיף"],
        hint: "השם קשור לאיסוף התבואה והפירות בסוף הקיץ.",
        explain: "חג הסוכות נקרא גם 'חג האסיף', ומכיוון שהוא חג האסיף המשפיע פרנסה לכל השנה, יש בו סגולה מיוחדת לשמוח בו שמחה שלמה מתוך אמונה והודיה לה'."
      },
      {
        prompt: "במעשה על הבעל שם טוב הקדוש במוצאי יום כיפור, למה הוא חיכה לפני שנכנס לרקוד בשמחה עם החסידים?",
        keywords: [
          "חיכה שתיראה הלבנה",
          "המתין לראיית הלבנה",
          "חיכה עד שראה את הלבנה",
          "קידוש לבנה סימן טוב",
          "חיכה לראות סימן טוב לעם ישראל"
        ],
        hint: "הוא חיכה לראות דבר מסוים בשמיים, שנחשב סימן טוב וברכה לעם ישראל...",
        explain: "הבעל שם טוב הקדוש חיכה במוצאי יום כיפור עד שנראתה הלבנה בשמיים, כי ראיית הלבנה הייתה עבורו סימן טוב לכך שה' רואה ברוח הקודש שהתפילות התקבלו לטובה, ורק אז שמח בשמחה שלמה עם החסידים."
      }
    ]
  }
];

var TOTAL_QUESTIONS = LEVELS.reduce(function(a, l){ return a + l.questions.length; }, 0);

// ---------- utils ----------
function cyrb53(str, seed) {
  seed = seed || 0;
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

function normalize(s) {
  return (s || '')
    .replace(/[֑-ֽֿ-ׇ]/g, '')
    .replace(/["'.,!?;:()\-]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
function stripHe(s) {
  return s.split(' ').map(function(w){
    return (w.length > 2 && w[0] === 'ה') ? w.slice(1) : w;
  }).join(' ');
}
function isCorrect(ans, keywords) {
  var a = normalize(ans);
  if (!a) return false;
  var al = stripHe(a);
  return keywords.some(function(k){
    var n = normalize(k), nl = stripHe(n);
    return a.indexOf(n) !== -1 || al.indexOf(nl) !== -1 || a.indexOf(nl) !== -1 || al.indexOf(n) !== -1;
  });
}

var COMPLIMENTS = ["כל הכבוד! 🎉", "ישר כוח! 💪", "מצוין! ⭐", "נהדר! 🌟", "יופי של תשובה! 🥳", "כל הכבוד לך! 🎊"];
function randomCompliment() {
  return COMPLIMENTS[Math.floor(Math.random() * COMPLIMENTS.length)];
}

function safeGet(key) {
  try { return localStorage.getItem(key); } catch(e) { return null; }
}
function safeSet(key, val) {
  try { localStorage.setItem(key, val); } catch(e) {}
}
function safeRemove(key) {
  try { localStorage.removeItem(key); } catch(e) {}
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

// ---------- theme ----------
(function initTheme(){
  var saved = safeGet('uq_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : (cur === 'light' ? '' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    safeSet('uq_theme', next);
  });
})();

// ---------- state ----------
var state = {
  student: null, // {id, name, cls, school}
  levelIdx: 0,
  qIdx: 0,
  attempts: 0,
  points: 0,
  submitted: false
};

function loadStudent() {
  var raw = safeGet('uq_student');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e) { return null; }
}
function saveStudent(st) {
  safeSet('uq_student', JSON.stringify(st));
}

// ---------- network ----------
function fetchLeaders() {
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_') === 0) {
    return Promise.resolve(null); // not configured
  }
  return fetch(CONFIG.API_URL + '?game=' + encodeURIComponent(CONFIG.GAME_ID) + '&limit=100')
    .then(function(r){ return r.json(); })
    .then(function(j){ return j && j.ok ? j.leaders : []; })
    .catch(function(){ return []; });
}
function sendScore(payload) {
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_') === 0) return Promise.resolve(false);
  return fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(function(){ return true; })
    .catch(function(){ return false; });
}
function sendEntry(student) {
  // רישום שקט למורה: כל תלמיד שנכנס למשחק, בלי קשר אם סיים אותו
  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_') === 0) return;
  fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({
    id: student.id, name: student.name, cls: student.cls, school: student.school,
    game: CONFIG.GAME_ID, type: 'entry'
  }) }).catch(function(){});
}

// ---------- leaderboard rendering ----------
var lbFilter = 'all';
var lbData = [];

function renderLeaderboard() {
  var body = document.getElementById('lbBody');
  if (lbData === null) {
    body.innerHTML = '<div class="lb-empty">רשימת התלמידים החכמים תופעל בקרוב ✨</div>';
    return;
  }
  var list = lbData.filter(function(r){ return (Number(r.score) || 0) >= CONFIG.PASS_SCORE; });
  if (state.student) {
    if (lbFilter === 'class') list = list.filter(function(r){ return r.cls === state.student.cls; });
    if (lbFilter === 'school') list = list.filter(function(r){ return r.school === state.student.school; });
  }
  list.sort(function(a,b){ return a.name.localeCompare(b.name, 'he'); });
  if (!list.length) {
    body.innerHTML = '<div class="lb-empty">עדיין אין כאן חכמים... היו הראשונים להצטרף! 🌟</div>';
    return;
  }
  var html = '<ul class="lb-list">';
  list.slice(0, 200).forEach(function(row){
    var isMe = state.student && row.name === state.student.name && row.cls === state.student.cls && row.school === state.student.school;
    html += '<li class="' + (isMe ? 'lb-me' : '') + '">' +
      '<span class="lb-rank">🎓</span>' +
      '<span class="lb-name">' + escapeHtml(row.name) + (isMe ? ' (אתם)' : '') +
        '<div class="lb-meta">' + escapeHtml(row.cls ? 'כיתה ' + row.cls : '') + (row.school ? ' · ' + escapeHtml(row.school) : '') + '</div>' +
      '</span>' +
    '</li>';
  });
  html += '</ul>';
  body.innerHTML = html;
}

function refreshLeaderboard() {
  document.getElementById('lbBody').innerHTML = '<div class="lb-loading">טוען...</div>';
  fetchLeaders().then(function(data){
    lbData = data === null ? null : data;
    renderLeaderboard();
  });
}

document.getElementById('lbFilters').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  lbFilter = btn.getAttribute('data-f');
  Array.prototype.forEach.call(document.querySelectorAll('#lbFilters button'), function(b){
    b.classList.toggle('active', b === btn);
  });
  renderLeaderboard();
});

// ---------- screens ----------
var screen = document.getElementById('screen');

function renderRegistration() {
  var classOpts = CONFIG.CLASSES.map(function(c){ return '<option value="'+escapeHtml(c)+'">כיתה '+escapeHtml(c)+'</option>'; }).join('');
  var schoolField = CONFIG.SCHOOLS.length
    ? '<select id="regSchool"><option value="">בחרו בית ספר</option>' + CONFIG.SCHOOLS.map(function(s){ return '<option value="'+escapeHtml(s)+'">'+escapeHtml(s)+'</option>'; }).join('') + '</select>'
    : '<input type="text" id="regSchool" placeholder="שם בית הספר" maxlength="60">';

  screen.innerHTML =
    '<h2>👋 לפני שמתחילים</h2>' +
    '<label for="regName">שם פרטי</label>' +
    '<input type="text" id="regName" placeholder="השם שלכם" maxlength="40">' +
    '<div class="hint-note">כדאי לכתוב שם פרטי ואות ראשונה של שם המשפחה. שימו לב: רשימת התלמידים החכמים גלויה לכל מי שיש לו את הקישור.</div>' +
    '<label for="regClass">כיתה</label>' +
    '<select id="regClass"><option value="">בחרו כיתה</option>' + classOpts + '</select>' +
    '<label for="regSchool">בית ספר</label>' +
    schoolField +
    '<button class="primary" id="regStart" type="button">בואו נתחיל! 🎉</button>';

  document.getElementById('regStart').addEventListener('click', function(){
    var name = document.getElementById('regName').value.trim();
    var cls = document.getElementById('regClass').value;
    var school = document.getElementById('regSchool').value.trim();
    if (name.length < 2) { alert('אנא כתבו שם (לפחות 2 אותיות)'); return; }
    if (!cls) { alert('אנא בחרו כיתה'); return; }
    if (!school) { alert('אנא כתבו/בחרו בית ספר'); return; }
    var key = normalize(name) + '|' + cls + '|' + normalize(school);
    var id = String(cyrb53(key));
    var st = { id: id, name: name, cls: cls, school: school };
    saveStudent(st);
    state.student = st;
    sendEntry(st);
    startGame();
  });
}

function renderSwitchLink() {
  var wrap = document.createElement('div');
  wrap.className = 'switch-student';
  wrap.textContent = 'לא אתם? החליפו תלמיד';
  wrap.addEventListener('click', function(){
    safeRemove('uq_student');
    state.student = null;
    boot();
  });
  return wrap;
}

function startGame() {
  state.levelIdx = 0;
  state.qIdx = 0;
  state.attempts = 0;
  state.points = 0;
  state.submitted = false;
  renderQuestion();
}

function currentQuestion() {
  return LEVELS[state.levelIdx].questions[state.qIdx];
}

function globalQuestionIndex() {
  var n = 0;
  for (var i = 0; i < state.levelIdx; i++) n += LEVELS[i].questions.length;
  return n + state.qIdx;
}

function renderQuestion() {
  var level = LEVELS[state.levelIdx];
  var q = currentQuestion();
  var gi = globalQuestionIndex();

  var dots = '';
  for (var i = 0; i < TOTAL_QUESTIONS; i++) {
    var cls = 'dot';
    if (i < gi) cls += ' filled';
    else if (i === gi) cls += ' current';
    dots += '<span class="' + cls + '"></span>';
  }

  screen.innerHTML =
    '<div class="progress-row"><span>שאלה ' + (gi+1) + ' מתוך ' + TOTAL_QUESTIONS + '</span><div class="dots">' + dots + '</div></div>' +
    '<div class="level-badge">' + escapeHtml(level.title) + '</div>' +
    '<div class="q-prompt">' + escapeHtml(q.prompt) + '</div>' +
    '<input type="text" id="ansInput" placeholder="כתבו כאן את התשובה...">' +
    '<button class="primary" id="ansSubmit" type="button">בדקו אותי ✔️</button>' +
    '<div id="fbArea"></div>';

  state.attempts = 0;
  document.getElementById('ansInput').focus();

  function submit() {
    var val = document.getElementById('ansInput').value;
    var fb = document.getElementById('fbArea');
    if (isCorrect(val, q.keywords)) {
      var pts = state.attempts === 0 ? 10 : (state.attempts === 1 ? 6 : 3);
      state.points += pts;
      fb.innerHTML = '<div class="feedback good">' + randomCompliment() +
        '<div class="explain">' + escapeHtml(q.explain) + '</div></div>';
      document.getElementById('ansInput').disabled = true;
      document.getElementById('ansSubmit').style.display = 'none';
      setTimeout(nextStep, 1900);
    } else {
      state.attempts++;
      var msg = state.attempts >= 3
        ? 'כמעט! הנה רמז נוסף: ' + escapeHtml(q.hint)
        : 'לא בדיוק, אבל אתם ממש קרובים! רמז: ' + escapeHtml(q.hint);
      var revealBtn = state.attempts >= 3 ? '<button class="reveal-btn" id="revealBtn" type="button">גלו לי את התשובה</button>' : '';
      fb.innerHTML = '<div class="feedback retry">' + msg + '</div>' + revealBtn;
      if (state.attempts >= 3) {
        document.getElementById('revealBtn').addEventListener('click', function(){
          state.points += 3;
          fb.innerHTML = '<div class="feedback good">התשובה: ' + escapeHtml(q.keywords[0]) +
            '<div class="explain">' + escapeHtml(q.explain) + '</div></div>';
          document.getElementById('ansInput').disabled = true;
          document.getElementById('ansSubmit').style.display = 'none';
          setTimeout(nextStep, 2200);
        });
      }
    }
  }
  document.getElementById('ansSubmit').addEventListener('click', submit);
  document.getElementById('ansInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') submit();
  });
}

function nextStep() {
  var level = LEVELS[state.levelIdx];
  if (state.qIdx < level.questions.length - 1) {
    state.qIdx++;
    renderQuestion();
  } else if (state.levelIdx < LEVELS.length - 1) {
    renderLevelComplete();
  } else {
    renderBonus();
  }
}

function renderLevelComplete() {
  var finishedLevel = LEVELS[state.levelIdx];
  var nextLevel = LEVELS[state.levelIdx + 1];
  screen.innerHTML =
    '<div class="celebrate">' +
      '<div class="emoji">🎊</div>' +
      '<h2>סיימתם את ' + escapeHtml(finishedLevel.title) + '!</h2>' +
      '<p>' + randomCompliment() + ' עכשיו נפתחת בפניכם דרגה חדשה:</p>' +
      '<p style="font-weight:700;">' + escapeHtml(nextLevel.title) + '</p>' +
      '<button class="primary" id="toNext" type="button">להמשיך לדרגה הבאה ⬅️</button>' +
    '</div>';
  document.getElementById('toNext').addEventListener('click', function(){
    state.levelIdx++;
    state.qIdx = 0;
    renderQuestion();
  });
}

function renderBonus() {
  screen.innerHTML =
    '<div class="celebrate">' +
      '<div class="emoji">🌿</div>' +
      '<h2>סיימתם את כל השאלות!</h2>' +
    '</div>' +
    '<div class="bonus-box">' +
      '<h3>🎁 משימת בונוס לבית - קישוט לסוכה</h3>' +
      'הכינו שרשרת צבעונית מרצועות נייר לקישוט הסוכה. לפני שמדביקים כל חוליה, התקשרו לקרוב משפחה, שכן או חבר, ובקשו ממנו מחילה או איחולי שלום. ' +
      'כתבו את שמו על הרצועה - ותלו את השרשרת בסוכה שלכם. כך תזכו שהסוכה שלכם תהיה גם סוכת שלום ואהבה! ☺️' +
    '</div>' +
    '<button class="primary" id="toFinish" type="button">לצפייה בציון שלי 🏁</button>';
  document.getElementById('toFinish').addEventListener('click', renderFinish);
}

function renderFinish() {
  var score = Math.round(state.points / (TOTAL_QUESTIONS * 10) * 100);
  screen.innerHTML =
    '<div class="celebrate">' +
      '<div class="emoji">🥳🍋🌿</div>' +
      '<h2>סיימתם את המשחק, ' + escapeHtml(state.student.name) + '!</h2>' +
      '<div class="score-num">' + score + '</div>' +
      '<div class="blessing">' +
        'כל הכבוד! למדתם היום על אברהם אבינו, איש החסד הראשון, שאהב את הקב״ה בכל ליבו ולא זז מאמונתו גם כשכל העולם חשב אחרת. ' +
        'בזכות אהבת ה׳ הגדולה שלו, אנחנו זוכים לחג הסוכות ולכל הטוב שבעולם. ' +
        'שנזכה כולנו, מתוך שמחה והודיה אמיתית, לאהוב את ה׳ בכל ליבנו כמו אברהם אבינו. חג סוכות שמח! 🌟' +
      '</div>' +
      '<div id="sendStatus" class="hint-note">שולח את הציון...</div>' +
    '</div>';

  var payload = { id: state.student.id, name: state.student.name, cls: state.student.cls, school: state.student.school, score: score, game: CONFIG.GAME_ID };
  sendScore(payload).then(function(ok){
    var st = document.getElementById('sendStatus');
    if (!st) return;
    if (ok) {
      st.textContent = 'הציון נשלח בהצלחה! ✅';
      refreshLeaderboard();
    } else {
      st.innerHTML = 'לא הצלחנו לשלוח את הציון. ' +
        '<div class="send-fail"><button class="secondary" id="retrySend" type="button">נסו שוב</button></div>';
      document.getElementById('retrySend').addEventListener('click', function(){
        st.textContent = 'שולח שוב...';
        sendScore(payload).then(function(ok2){
          if (ok2) { st.textContent = 'הציון נשלח בהצלחה! ✅'; refreshLeaderboard(); }
          else renderFinish();
        });
      });
    }
  });
}

// ---------- boot ----------
function boot() {
  state.student = loadStudent();
  if (state.student) {
    sendEntry(state.student);
    screen.innerHTML = '';
    var welcome = document.createElement('div');
    welcome.innerHTML =
      '<h2>ברוכים השבים, ' + escapeHtml(state.student.name) + '! 👋</h2>' +
      '<p style="text-align:center;color:var(--text-soft);font-size:14px;">כיתה ' + escapeHtml(state.student.cls) + ' · ' + escapeHtml(state.student.school) + '</p>' +
      '<button class="primary" id="beginBtn" type="button">להתחיל את המשחק! 🎮</button>';
    screen.appendChild(welcome);
    screen.appendChild(renderSwitchLink());
    document.getElementById('beginBtn').addEventListener('click', startGame);
  } else {
    renderRegistration();
  }
  renderLeaderboard();
  refreshLeaderboard();
}

boot();

})();
</script>
</body>
</html>
